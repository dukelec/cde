/* https://github.com/jgthms/bulma/issues/2259#issuecomment-516137922 */
.navbar>.container {
    align-items: stretch;

    min-height: 3.25rem;
    width: 100%;

.navbar-burger {
    display: none;

/* https://stackoverflow.com/questions/50400219/bulma-progress-text-in-middle */
.progress-wrapper {
  position: relative;
}
.progress-value {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  font-size: calc(1rem / 1.5);
  line-height: 1rem;
  font-weight: bold;
}
.progress.is-small+.progress-value {
  font-size: calc(0.75rem / 1.5);
  line-height: 0.75rem;
}
.progress.is-medium+.progress-value {
  font-size: calc(1.25rem / 1.5);
  line-height: 1.25rem;
}
.progress.is-large+.progress-value {
  font-size: calc(1.5rem / 1.5);
  line-height: 1.5rem;
}
</style>
